:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#12201B; --muted:#5C6B65; --line:#D5DDD9;
  --accent:#0F6E5A; --accent-ink:#FFFFFF; --accent-soft:#DCEDE7;
  --extra:#A9580A; --extra-soft:#F6E8D6;

}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1513; --surface:#16201D; --ink:#E6EEEA; --muted:#93A49D; --line:#2A3632;
  --accent:#3FBF9C; --accent-ink:#06221B; --accent-soft:#163A31;
  --extra:#E59A47; --extra-soft:#3A2A17;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;

  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px));}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h2{font-size:1.15rem;font-weight:700}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.brand .tag{font-size:.8rem;color:var(--muted)}
.status{font-size:.75rem;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--accent)} .status.err i{background:var(--warn)} .status.local i{background:var(--extra)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}

.clock{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}

.clock .time small{font-size:.45em;color:var(--muted);margin-left:2px}
.state{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:.95rem}
.state i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.state.on i{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

.gpsline.bad{color:var(--warn)}

.stat b{font-family:var(--font-mono);font-weight:500;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat.ex b{color:var(--extra)} .stat.nt b{color:var(--night)}

.prow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}

.loc.far{background:var(--warn-soft);color:var(--warn)}
.loc.none{background:var(--bg);color:var(--muted)}

.tl{position:relative;height:12px;border-radius:6px;background:var(--bg);overflow:hidden}

.tl .iv{position:absolute;top:2px;bottom:2px;border-radius:4px;background:var(--accent)}

.ticks{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:.68rem;color:var(--muted);margin-top:4px}

.pill{font-size:.72rem;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav h2{text-transform:capitalize;min-width:9.5em;text-align:center}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:1.1rem}
.days{display:flex;flex-direction:column}
.day{appearance:none;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line);width:100%}
.day:first-child{border-top:0}
.day:hover{background:var(--bg)}
.day .d{display:flex;flex-direction:column;line-height:1.1}
.day .d b{font-family:var(--font-mono);font-size:1.2rem;font-weight:500}
.day .d span{font-size:.72rem;color:var(--muted)}
.day .mid{display:flex;flex-direction:column;gap:6px;min-width:0}
.day .mid .p{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .tot{text-align:right;font-family:var(--font-mono);font-size:.85rem;display:flex;flex-direction:column;gap:1px}
.day .tot .x{color:var(--extra)}
.day.today .d b{color:var(--accent)}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.empty-state{text-align:center;padding:20px 8px;display:flex;flex-direction:column;gap:10px;align-items:center}

.meter{position:relative;height:14px;border-radius:7px;background:var(--bg)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--extra)}
.meter .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.meter-labels{position:relative;height:18px;font-family:var(--font-mono);font-size:.7rem;color:var(--muted)}
.meter-labels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--font-body)}
tr.total td{font-weight:600;border-bottom:0}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.82rem;font-weight:500}
.field .hint{font-size:.75rem;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent)}
input[type=number],input[type=time],input[type=date],input[type=email],input[type=password],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px;width:100%;min-width:0}
.rules{font-size:.86rem;display:flex;flex-direction:column;gap:8px;margin:0;padding-left:18px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{appearance:none;border:0;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

.overlay{position:fixed;inset:0;background:rgba(10,18,15,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding-top:max(12px,env(safe-area-inset-top,0px))}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:100%;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:18px}}
.pair{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.pair .field label{font-size:.72rem;color:var(--muted)}
.pairbox{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
textarea{min-height:80px;font-family:var(--font-mono);font-size:.78rem}

/* Entrar */
.auth{max-width:400px;margin:6vh auto 0}
.auth .lead{margin:0;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;padding:8px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.msg{font-size:.86rem;border-radius:8px;padding:8px 10px;background:var(--accent-soft);color:var(--accent)}
.msg.err{background:var(--warn-soft);color:var(--warn)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);
  padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),

      else{openPast=true;return}
      iv.push([a,b,!p[1]]);worked+=b-a;night+=nightOverlap(a,b);
      if(b-a>300)longRun=true;
    });
    const type=dayType(k,d,s);
    const bk={u1lo:0,u1hi:0,u2lo:0,u2hi:0,rlo:0,rhi:0};
    let cum=cumY[y]||0,normal=0,ex=0;
    const put=(amt,lo,hi)=>{if(amt<=0)return;const below=Math.max(0,Math.min(amt,6000-cum));bk[lo]+=below;bk[hi]+=amt-below;cum+=amt};
    if(type.kind==="util"){
      normal=Math.min(worked,s.daily*60);ex=worked-normal;
      const wk=weekKey(k),rem=Math.max(0,s.weekly*60-(week[wk]||0));
      if(normal>rem){ex+=normal-rem;normal=rem}
      week[wk]=(week[wk]||0)+normal;
      const f=Math.min(60,ex);put(f,"u1lo","u1hi");put(ex-f,"u2lo","u2hi");
    }else{ex=worked;put(ex,"rlo","rhi")}
    cumY[y]=cum;
    const warn=[];
    if(openPast)warn.push("Falta registar uma saída neste dia.");
    if(type.kind==="util"&&ex>120)warn.push("Mais de 2 horas suplementares num dia útil (limite do art. 228.º).");
    if(type.kind==="rest"&&ex>s.daily*60)warn.push("Trabalho em dia de descanso acima do período normal diário (art. 228.º).");
    if(longRun)warn.push("Mais de 5 horas seguidas sem intervalo (art. 213.º).");
    if(far)warn.push(far===1?"Uma picagem foi feita fora do local de trabalho.":far+" picagens foram feitas fora do local de trabalho.");
    res[k]={worked,normal,ex,night,bk,type,iv,warn,live,cum};
  }
  return res;
}
function hourly(s){return s.salary>0&&s.weekly>0?(s.salary*12)/(52*s.weekly):0}
function valueOf(r,s){const h=hourly(s);if(!h)return 0;let v=0;for(const x in PCT)v+=r.bk[x]/60*h*(1+PCT[x]);return v+r.night/60*h*(s.nightPct/100)}
function aggregate(res,prefix,s){
  const a={worked:0,normal:0,ex:0,night:0,days:0,value:0,bk:{u1lo:0,u1hi:0,u2lo:0,u2hi:0,rlo:0,rhi:0}};
  for(const k in res){if(!k.startsWith(prefix))continue;const r=res[k];
    a.worked+=r.worked;a.normal+=r.normal;a.ex+=r.ex;a.night+=r.night;if(r.worked>0)a.days++;
    for(const x in a.bk)a.bk[x]+=r.bk[x];a.value+=valueOf(r,s)}
  return a;
}

/* ---------- localização ---------- */
function haversine(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function getPosition(){
  return new Promise(resolve=>{
    if(!("geolocation" in navigator))return resolve({err:"Este dispositivo não tem localização."});
    if(!window.isSecureContext)return resolve({err:"A localização só funciona num endereço https://."});
    navigator.geolocation.getCurrentPosition(p=>{
      const loc={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)};
      if(settings.workLat!=null)loc.d=Math.round(haversine(loc.lat,loc.lng,settings.workLat,settings.workLng));
      lastFix={...loc,at:Date.now()};resolve(loc);
    },e=>{
      resolve({err:e.code===1?"Permissão de localização negada.":e.code===3?"A localização demorou demasiado.":"Localização indisponível."});
    },{enableHighAccuracy:true,timeout:15000,maximumAge:20000});
  });
}
const mapUrl=l=>`https://www.openstreetmap.org/?mlat=${l.lat}&mlon=${l.lng}#map=18/${l.lat}/${l.lng}`;
function locChip(l,label){
  if(!l)return "";
  if(l.err)return `<span class="loc none" title="${esc(l.err)}">${PIN}${label}: sem localização</span>`;
  const far=l.d!=null&&settings.workLat!=null&&l.d>(+settings.workRadius||200)+(l.acc||0);
  const where=l.d!=null&&settings.workLat!=null?(far?"a "+fmtDist(l.d)+" do local":"no local"):"±"+l.acc+" m";
  return `<a class="loc${far?" far":""}" href="${mapUrl(l)}" target="_blank" rel="noopener">${PIN}${label}: ${where}</a>`;
}

/* ---------- Supabase: dados ---------- */
function setStatus(kind,text){const el=document.getElementById("status");el.className="status "+kind;el.lastElementChild.textContent=text}
const LS="pontocerto.cache.v1";
function cacheSave(){try{localStorage.setItem(LS,JSON.stringify({uid:session&&session.user.id,days,settings,pending:[...pending]}))}catch(e){}}
function cacheLoad(uid){try{const o=JSON.parse(localStorage.getItem(LS)||"null");if(o&&o.uid===uid){days=o.days||{};settings={...DEFAULTS,...o.settings};(o.pending||[]).forEach(k=>pending.add(k));return true}}catch(e){}return false}

function toRow(k){
  const d=days[k];
  return {dia:k,tipo:d.t||"auto",nota:d.note||"",updated_at:new Date().toISOString(),
    periodos:(d.p||[]).map((p,i)=>({e:p[0],s:p[1]||null,le:(d.g&&d.g[i]&&d.g[i][0])||null,ls:(d.g&&d.g[i]&&d.g[i][1])||null}))};
}
function fromRow(r){
  const per=r.periodos||[];
  return {t:r.tipo||"auto",note:r.nota||"",p:per.map(x=>[x.e,x.s||null]),g:per.map(x=>[x.le||null,x.ls||null])};
}
async function loadAll(){
  setStatus("","A carregar…");
  const [a,b]=await Promise.all([
    sb.from("ponto_dias").select("dia,tipo,periodos,nota").order("dia"),
    sb.from("ponto_definicoes").select("dados").maybeSingle()
  ]);
  if(a.error||b.error)throw (a.error||b.error);
  const nd={};for(const r of a.data)nd[r.dia]=fromRow(r);
  for(const k of pending)if(days[k]!==undefined)nd[k]=days[k]; else delete nd[k]; // alterações locais por enviar ganham
  days=nd;
  if(b.data&&b.data.dados)settings={...DEFAULTS,...b.data.dados};
  cacheSave();
}
const pending=new Set();let flushing=false;
function persistDay(k){pending.add(k);cacheSave();flush()}
async function flush(){
  if(flushing||!sb||!session)return;flushing=true;
  try{
    while(pending.size){
      const k=[...pending][0];
      let r;
      if(days[k])r=await sb.from("ponto_dias").upsert({...toRow(k),user_id:session.user.id});
      else r=await sb.from("ponto_dias").delete().eq("dia",k);
      if(r.error)throw r.error;
      pending.delete(k);cacheSave();
    }
    setStatus("ok","Guardado na nuvem");
  }catch(e){
    setStatus(navigator.onLine?"err":"local",navigator.onLine?"Erro ao guardar · vai tentar de novo":"Sem rede · guardado no telemóvel");
    setTimeout(()=>{flushing=false;flush()},navigator.onLine?8000:20000);return;
  }
  flushing=false;
}
let setTimer;
function persistSettings(){
  cacheSave();clearTimeout(setTimer);
  setTimer=setTimeout(async()=>{
    const r=await sb.from("ponto_definicoes").upsert({user_id:session.user.id,dados:settings,updated_at:new Date().toISOString()});
    if(r.error)setStatus("err","Erro ao guardar definições");else setStatus("ok","Guardado na nuvem");
  },500);
}
addEventListener("online",flush);
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState==="visible"&&session&&ready&&!editing){try{await flush();await loadAll();render()}catch(e){}}
});

/* ---------- picar ponto ---------- */
function nowHM(d){return pad(d.getHours())+":"+pad(d.getMinutes())}
function openState(){
  const now=new Date(),k=keyOf(now),y=new Date(now);y.setDate(y.getDate()-1);const yk=keyOf(y);
  const find=d=>d?d.p.findIndex(p=>p[0]&&!p[1]):-1;
  const d=days[k],i=find(d);
  if(i>=0)return {key:k,i,yesterday:false};
  const yd=days[yk],yi=find(yd);
  if(yi>=0&&!(d&&d.p.length))return {key:yk,i:yi,yesterday:true};
  return null;
}
async function punch(){
  if(!ready||busyPunch)return;
  busyPunch=true;render();
  const now=new Date(),t=nowHM(now);
  const loc=await getPosition();
  busyPunch=false;
  if(loc.err&&settings.requireLoc){render();toast(loc.err+" A picagem não foi registada.");return}
  const st=openState(),k=keyOf(now);
  if(st){
    const d=days[st.key];d.p[st.i][1]=t;d.g=d.g||[];d.g[st.i]=d.g[st.i]||[null,null];d.g[st.i][1]=loc;
    persistDay(st.key);toast("Saída registada às "+t+(st.yesterday?" (turno de ontem)":"")+(loc.err?" · sem localização":""));
  }else{
    if(!days[k])days[k]={t:"auto",p:[],g:[],note:""};
    days[k].g=days[k].g||[];
    days[k].p.push([t,null]);days[k].g[days[k].p.length-1]=[loc,null];
    persistDay(k);toast("Entrada registada às "+t+(loc.err?" · sem localização":""));
  }
  render();
}

function timeline(iv,small){
  let h=`<div class="tl${small?" small":""}" aria-hidden="true"><span class="nz" style="left:0;width:${7/24*100}%"></span><span class="nz" style="left:${22/24*100}%;width:${2/24*100}%"></span>`;
  for(const [a,b,live] of iv){
    const seg=(x,y)=>`<span class="iv${live?" live":""}" style="left:${x/1440*100}%;width:${Math.max(.4,(y-x)/1440*100)}%"></span>`;
    h+=seg(a,Math.min(b,1440));if(b>1440)h+=seg(0,b-1440);
  }
  return h+"</div>";
}
function breakdownRows(bk){
  const rows=[["u1lo","Dia útil · 1.ª hora (+25%)"],["u2lo","Dia útil · horas seguintes (+37,5%)"],["rlo","Descanso / feriado (+50%)"],
              ["u1hi","Dia útil · 1.ª hora, após 100h (+50%)"],["u2hi","Dia útil · seguintes, após 100h (+75%)"],["rhi","Descanso / feriado, após 100h (+100%)"]];

}

  const far=work&&lastFix.d>(+settings.workRadius||200)+(lastFix.acc||0);

    <div class="form">
      <div class="field"><label for="s-workName">Nome do local</label><input id="s-workName" type="text" value="${esc(s.workName)}" placeholder="Ex.: Obra Alcântara" style="border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px"></div>
      <div class="field"><label for="s-workRadius">Raio de tolerância (metros)</label><input id="s-workRadius" type="number" min="20" max="5000" step="10" value="${s.workRadius}"></div>
    </div>
    <div class="row">
      <button class="btn primary" id="setWork">${hasWork?"Atualizar com a minha posição atual":"Usar a minha posição atual"}</button>
      ${hasWork?`<button class="btn ghost" id="clearWork">Remover local</button>`:""}
    </div>
    <label class="check"><input type="checkbox" id="s-requireLoc" ${s.requireLoc?"checked":""}><span>Só aceitar picagens com localização<br><span class="muted" style="font-size:.8rem">Se o GPS falhar ou for negado, a picagem não é registada.</span></span></label>
  </section>
  <section class="card">
    <h2>O seu horário</h2>
    <div class="form">
      <div class="field"><label for="s-daily">Período normal diário (horas)</label><input id="s-daily" type="number" min="1" max="12" step="0.5" value="${s.daily}"><span class="hint">Regra geral: 8h (art. 203.º)</span></div>
      <div class="field"><label for="s-weekly">Período normal semanal (horas)</label><input id="s-weekly" type="number" min="1" max="60" step="0.5" value="${s.weekly}"><span class="hint">Regra geral: 40h (art. 203.º)</span></div>
      <div class="field"><label for="s-restMand">Descanso semanal obrigatório</label><select id="s-restMand">${wdOpt(s.restMand)}</select></div>
      <div class="field"><label for="s-restComp">Descanso complementar</label><select id="s-restComp">${wdOpt(s.restComp,true)}</select></div>
    </div>
  </section>
  <section class="card">
    <h2>Remuneração e limites</h2>
    <div class="form">
      <div class="field"><label for="s-salary">Retribuição base mensal (€)</label><input id="s-salary" type="number" min="0" step="10" value="${s.salary||""}" placeholder="Ex.: 1100"><span class="hint">${h?"Valor/hora: <b class='mono'>"+eur.format(h)+"</b> = (salário × 12) ÷ (52 × horas semanais), art. 271.º":"Opcional. Serve para calcular o valor das horas extra."}</span></div>
      <div class="field"><label for="s-limitYear">Limite anual de trabalho suplementar</label><select id="s-limitYear"><option value="175"${+s.limitYear===175?" selected":""}>175h · micro ou pequena empresa</option><option value="150"${+s.limitYear===150?" selected":""}>150h · média ou grande empresa</option></select><span class="hint">Art. 228.º</span></div>
      <div class="field"><label for="s-nightPct">Acréscimo de trabalho noturno (%)</label><input id="s-nightPct" type="number" min="0" max="100" step="1" value="${s.nightPct}"><span class="hint">Regra geral: 25%, das 22h às 7h (arts. 223.º e 266.º)</span></div>
    </div>
  </section>
  <section class="card">
    <h2>Como as horas são calculadas</h2>
    <ul class="rules">
      <li><b>Dia útil:</b> até ao período normal diário conta como normal. O excesso é trabalho suplementar. Se a semana passar do período semanal, o excedente também passa a suplementar.</li>
      <li><b>Acréscimos (art. 268.º):</b> até 100 horas por ano, 1.ª hora +25% e seguintes +37,5% em dia útil; +50% em descanso ou feriado. A partir das 100 horas: +50%, +75% e +100%.</li>
      <li><b>Descanso e feriados:</b> todas as horas são suplementares. Feriados nacionais (art. 234.º) são reconhecidos automaticamente; o feriado municipal marca-se ao corrigir o dia.</li>
      <li>Um contrato coletivo pode fixar valores mais favoráveis. Nesse caso prevalece o contrato.</li>
    </ul>
  </section>
  <section class="card">
    <div class="spread"><span class="muted" style="font-size:.88rem">Sessão iniciada como <b>${esc(session&&session.user.email)}</b></span><button class="btn" id="logout">Terminar sessão</button></div>
  </section>`;
}

/* ---------- entrar ---------- */
let authMode="in",authMsg=null;
function viewAuth(){
  return `<section class="card auth">
    <h2>Entrar no Ponto Certo</h2>
    <p class="lead">Os seus registos ficam guardados na sua conta e acessíveis em qualquer dispositivo.</p>
    <div class="seg" role="group" aria-label="Modo"><button id="m-in" aria-pressed="${authMode==="in"}">Entrar</button><button id="m-up" aria-pressed="${authMode==="up"}">Criar conta</button></div>
    <form id="authForm" class="form" style="grid-template-columns:1fr">
      <div class="field"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="a-pass">Palavra-passe</label><input id="a-pass" type="password" autocomplete="${authMode==="in"?"current-password":"new-password"}" minlength="6" required><span class="hint">${authMode==="up"?"Pelo menos 6 caracteres.":""}</span></div>
      ${authMsg?`<div class="msg${authMsg.err?" err":""}">${esc(authMsg.text)}</div>`:""}
      <button class="punch" type="submit" id="a-go" style="min-height:52px;font-size:1rem">${authMode==="in"?"Entrar":"Criar conta"}</button>
    </form>
  </section>`;
}
async function doAuth(ev){
  ev.preventDefault();
  const email=document.getElementById("a-email").value.trim(),pass=document.getElementById("a-pass").value;
  const btn=document.getElementById("a-go");btn.disabled=true;btn.textContent="Um momento…";
  let r;
  if(authMode==="in")r=await sb.auth.signInWithPassword({email,password:pass});
  else r=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}});
  if(r.error){
    const m=r.error.message||"";
    authMsg={err:true,text:/Invalid login/i.test(m)?"Email ou palavra-passe incorretos.":/not confirmed/i.test(m)?"Confirme primeiro o email através da mensagem que recebeu.":/already registered/i.test(m)?"Este email já tem conta. Escolha Entrar.":"Não foi possível: "+m};
    render();const e=document.getElementById("a-email");if(e)e.value=email;return;
  }
  if(authMode==="up"&&!r.data.session){authMode="in";authMsg={text:"Conta criada. Abra o email de confirmação e depois entre aqui."};render();return}
}

/* ---------- modal de edição ---------- */
let editing=null;
function openEdit(k,isNew){
  const d=days[k];
  editing={key:k,isNew:!!isNew,t:d&&d.t||"auto",p:clone(d&&d.p||[]),g:clone(d&&d.g||[]),note:d&&d.note||"",confirmDel:false};
  if(!editing.p.length){editing.p.push(["",""]);editing.g.push([null,null])}
  drawModal();
}
function drawModal(){
  const m=document.getElementById("modal");
  if(!editing){m.innerHTML="";return}
  const e=editing,auto=dayType(e.key,{t:"auto"},settings).label,date=parseKey(e.key);
  m.innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="spread"><h2 id="mt">${e.isNew?"Adicionar dia":WD_LONG[date.getDay()]+", "+date.getDate()+" de "+MONTHS[date.getMonth()]}</h2><button class="btn ghost" data-act="close">Fechar</button></div>
    ${e.isNew?`<div class="field"><label for="e-date">Data</label><input id="e-date" type="date" value="${e.key}"></div>`:""}
    <div class="field"><label for="e-type">Tipo de dia</label><select id="e-type">
      <option value="auto"${e.t==="auto"?" selected":""}>Automático (${esc(auto)})</option>
      <option value="util"${e.t==="util"?" selected":""}>Dia útil</option>
      <option value="descanso"${e.t==="descanso"?" selected":""}>Dia de descanso</option>
      <option value="feriado"${e.t==="feriado"?" selected":""}>Feriado (inclui municipal)</option></select></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${e.p.map((p,i)=>{const g=e.g[i]||[];return `<div class="pairbox"><div class="pair">
        <div class="field"><label for="e-in-${i}">Entrada</label><input id="e-in-${i}" type="time" data-i="${i}" data-j="0" value="${esc(p[0]||"")}"></div>
        <div class="field"><label for="e-out-${i}">Saída</label><input id="e-out-${i}" type="time" data-i="${i}" data-j="1" value="${esc(p[1]||"")}"></div>
        <button class="iconbtn" data-act="rm" data-i="${i}" aria-label="Remover período">×</button></div>
        ${g[0]||g[1]?`<div class="prow">${locChip(g[0],"entrada")}${locChip(g[1],"saída")}</div>`:""}</div>`}).join("")}
      <div><button class="btn" data-act="addp">Adicionar período</button></div>
      <p class="muted" style="margin:0;font-size:.8rem">Um período por cada bloco de trabalho (por exemplo, manhã e tarde). Uma saída anterior à entrada conta como turno que passa a meia-noite. Períodos adicionados à mão ficam sem localização.</p>
    </div>
    <div class="field"><label for="e-note">Nota</label><input id="e-note" type="text" value="${esc(e.note)}" placeholder="Ex.: reunião no cliente" style="border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px"></div>
    <div class="spread">
      ${e.isNew?"<span></span>":`<button class="btn danger" data-act="del">${e.confirmDel?"Confirmar: apagar dia":"Apagar dia"}</button>`}
      <div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="save">Guardar</button></div>
    </div>
  </div></div>`;
}
function syncInputs(){
  const m=document.getElementById("modal");
  m.querySelectorAll("input[type=time]").forEach(inp=>{editing.p[+inp.dataset.i][+inp.dataset.j]=inp.value});
  const t=m.querySelector("#e-type");if(t)editing.t=t.value;
  const n=m.querySelector("#e-note");if(n)editing.note=n.value;
  const dt=m.querySelector("#e-date");if(dt&&dt.value)editing.key=dt.value;
}
function saveEdit(){
  syncInputs();const e=editing;
  if(e.p.some(p=>p[1]&&!p[0])){toast("Indique a hora de entrada de cada período.");return}
  if(e.isNew&&days[e.key]){const ex=days[e.key];e.p=[...ex.p.map(x=>[x[0],x[1]||""]),...e.p];e.g=[...(ex.g||ex.p.map(()=>[null,null])),...e.g]}
  const items=e.p.map((p,i)=>({p,g:e.g[i]||[null,null]})).filter(x=>x.p[0]).sort((a,b)=>a.p[0]<b.p[0]?-1:1);
  if(!items.length&&e.t==="auto"&&!e.note)delete days[e.key];
  else days[e.key]={t:e.t,p:items.map(x=>[x.p[0],x.p[1]||null]),g:items.map(x=>x.g),note:e.note||""};
  persistDay(e.key);editing=null;drawModal();toast("Dia guardado");render();
}
document.getElementById("modal").addEventListener("click",ev=>{
  if(ev.target.id==="ov"){editing=null;drawModal();render();return}
  const b=ev.target.closest("[data-act]");if(!b)return;syncInputs();
  const act=b.dataset.act;
  if(act==="close"){editing=null;drawModal();render()}
  else if(act==="addp"){editing.p.push(["",""]);editing.g.push([null,null]);drawModal()}
  else if(act==="rm"){const i=+b.dataset.i;editing.p.splice(i,1);editing.g.splice(i,1);if(!editing.p.length){editing.p.push(["",""]);editing.g.push([null,null])}drawModal()}
  else if(act==="save")saveEdit();
  else if(act==="del"){if(!editing.confirmDel){editing.confirmDel=true;drawModal();return}
    const k=editing.key;delete days[k];persistDay(k);editing=null;drawModal();toast("Dia apagado");render()}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&editing){editing=null;drawModal();render()}});

/* ---------- CSV ---------- */
function csvMonth(){
  const res=compute(days,settings,new Date()),{y,m}=viewMonth,prefix=y+"-"+pad(m+1);
  const L=l=>!l?"":l.err?"sem localização":l.lat+","+l.lng+" (±"+l.acc+"m)";
  const lines=["Data;Tipo;Entrada;Saída;Local entrada;Local saída;Trabalhado no dia;Normal;Suplementar;Noturno;Valor (€);Nota"];
  Object.keys(res).filter(k=>k.startsWith(prefix)).sort().forEach(k=>{const r=res[k],d=days[k];
    const tot=[fmtH(r.worked),fmtH(r.normal),fmtH(r.ex),fmtH(r.night),valueOf(r,settings).toFixed(2).replace(".",",")];
    (d.p.length?d.p:[[" "," "]]).forEach((p,i)=>{const g=(d.g&&d.g[i])||[];
      lines.push([k,r.type.label,p[0]||"",p[1]||"",L(g[0]),L(g[1]),...(i===0?tot:["","","","",""]),i===0?(d.note||"").replace(/;/g,","):""].join(";"))});
  });
  return "﻿"+lines.join("\n");
}
function exportCSV(){
  const {y,m}=viewMonth,blob=new Blob([csvMonth()],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`ponto-${y}-${pad(m+1)}.csv`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- render ---------- */
function render(){
  const v=document.getElementById("view"),nav=document.querySelector("nav.tabs");
  if(!session){nav.hidden=true;v.innerHTML=sb?viewAuth():`<section class="card"><p class="muted" style="margin:0">Não foi possível carregar o serviço. Verifique a ligação à internet e recarregue a página.</p></section>`;return}
  nav.hidden=false;
  v.innerHTML=tab==="hoje"?viewHoje():tab==="mes"?viewMes():tab==="ano"?viewAno():viewDef();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
}
const view=document.getElementById("view");
view.addEventListener("submit",ev=>{if(ev.target.id==="authForm")doAuth(ev)});
view.addEventListener("click",async ev=>{
  const t=ev.target.closest("button");if(!t)return;
  if(t.id==="m-in"||t.id==="m-up"){authMode=t.id==="m-in"?"in":"up";authMsg=null;render();return}
  if(t.id==="punchBtn")punch();
  else if(t.dataset.edit)openEdit(t.dataset.edit,false);
  else if(t.id==="addDay")openEdit(keyOf(new Date()),true);
  else if(t.id==="prevM"){viewMonth.m--;if(viewMonth.m<0){viewMonth.m=11;viewMonth.y--}render()}
  else if(t.id==="nextM"){viewMonth.m++;if(viewMonth.m>11){viewMonth.m=0;viewMonth.y++}render()}
  else if(t.id==="prevY"){viewYear--;render()}
  else if(t.id==="nextY"){viewYear++;render()}
  else if(t.id==="csvBtn")exportCSV();
  else if(t.id==="setWork"){
    t.disabled=true;t.textContent="A obter localização…";
    const l=await getPosition();
    if(l.err){toast(l.err);render();return}
    settings.workLat=l.lat;settings.workLng=l.lng;persistSettings();render();
    toast("Local de trabalho definido (precisão ±"+l.acc+" m)");
  }
  else if(t.id==="clearWork"){settings.workLat=null;settings.workLng=null;persistSettings();render()}
  else if(t.id==="logout"){await sb.auth.signOut();try{localStorage.removeItem(LS)}catch(e){}days={};settings={...DEFAULTS};pending.clear();render()}
});
view.addEventListener("change",ev=>{
  const id=ev.target.id;if(!id||!id.startsWith("s-"))return;
  const key=id.slice(2);let val;
  if(ev.target.type==="checkbox")val=ev.target.checked;
  else if(ev.target.type==="text")val=ev.target.value.trim();
  else{val=parseFloat(ev.target.value);if(isNaN(val))val=key==="salary"?0:DEFAULTS[key]}
  settings[key]=val;persistSettings();render();toast("Definições guardadas");
});
document.querySelector("nav.tabs").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;tab=b.dataset.tab;render();window.scrollTo(0,0)});

let toastT;
function toast(msg){const box=document.getElementById("toastbox");box.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>box.innerHTML="",3000)}

let lastMin=-1;
setInterval(()=>{
  const n=new Date(),el=document.getElementById("clockTime");
  if(el)el.innerHTML=`${pad(n.getHours())}:${pad(n.getMinutes())}<small>${pad(n.getSeconds())}</small>`;
  if(n.getMinutes()!==lastMin){lastMin=n.getMinutes();if(session&&tab==="hoje"&&!editing&&!busyPunch)render()}
},1000);

/* ---------- arranque ---------- */
async function onSession(s){
  const had=!!session;session=s;
  if(!s){ready=false;setStatus("","Sem sessão");render();return}
  if(had&&ready)return;
  ready=false;
  if(cacheLoad(s.user.id)){ready=true;setStatus("local","A sincronizar…")}
  render();
  try{await loadAll();ready=true;setStatus("ok","Sincronizado");flush()}
  catch(e){if(Object.keys(days).length||pending.size){ready=true;setStatus("local","Sem rede · a usar dados do telemóvel")}else setStatus("err","Não foi possível carregar os registos")}
  render();
}
(async()=>{
  if(!window.supabase||!window.supabase.createClient){setStatus("err","Sem ligação");render();return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e,s)=>{onSession(s)});
  await onSession(data.session);
  // pede a permissão de localização cedo, para a primeira picagem ser rápida
  if(data.session&&navigator.permissions&&navigator.permissions.query){
    try{const p=await navigator.permissions.query({name:"geolocation"});if(p.state==="granted")getPosition().then(()=>{if(tab==="hoje"&&!editing)render()})}catch(e){}
  }
})();
})();
</script>
</body>
</html>
